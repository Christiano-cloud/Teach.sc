    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            /* A nice, warm gradient background */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #d35400;
            font-size: 3.5em;
            margin-bottom: 5px;
            font-family: 'Playfair Display', serif;
        }
        h3 {
            color: #666;
            font-weight: 400;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        button.subject-btn {
            background: #ff7e5f;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4);
        }
        button.subject-btn:hover {
            transform: translateY(-3px);
            background: #feb47b;
            box-shadow: 0 6px 20px rgba(255, 126, 95, 0.6);
        }
        
        /* Styles for the message page */
        .hidden {
            display: none !important;
        }
        #message-page {
            animation: fadeIn 0.6s ease;
            text-align: left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back-btn {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .back-btn:hover {
            background: #34495e;
        }
        .teacher-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .message-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap; /* Keeps your paragraph breaks */
        }
    </style>
</head>

        function openMessage(subject) {
            // Hide home page, show message page
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('message-page').classList.remove('hidden');

            // Populate data
            document.getElementById('teacher-img').src = teacherData[subject].image;
            document.getElementById('teacher-message').innerText = teacherData[subject].message;

            // Trigger Party Popper (Confetti) Effect
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff7e5f', '#feb47b', '#f6d365', '#fda085']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff7e5f', '#feb47b', '#f6d365', '#fda085']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function goBack() {
            // Hide message page, show home page
            document.getElementById('message-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
